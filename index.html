    <main class="flex-1 max-w-md w-full mx-auto flex flex-col overflow-hidden bg-white shadow-xl relative">

        <!-- ==================== VIEW 1: 搜尋與選題探索面板 ==================== -->

                </label>

            <div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shadow-xs">

                    <span class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0"></span>

                <button onclick="toggleView('search')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-2.5 py-1 rounded-lg transition flex items-center gap-1 flex-shrink-0">

            <div id="typingIndicator" class="hidden px-4 py-2 bg-amber-50 border-t border-amber-200 text-xs text-amber-800 flex items-center justify-between">

                        <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                    </span>
                    <span id="typingText">七七團隊正在查找醫學文獻與梳理爭點中...</span>
                </div>
                <span class="text-[10px] text-amber-600 font-mono">RESEARCHING...</span>
            </div>

            <!-- 底部追問 / 互動輸入框 -->
            <div class="bg-white border-t border-slate-200 p-3">
                <form id="chatForm" onsubmit="handleFollowUp(event)" class="flex items-center space-x-2">
                    <div class="relative flex-1">
                        <input 
                            type="text" 
                            id="followUpInput" 
                            placeholder="問問七七：這對一般人有何副作用？怎麼挑選？" 
                            class="w-full bg-slate-100 border border-slate-200 rounded-xl py-2 px-3 text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition"
                        />
                    </div>
                    <button 
                        type="submit" 
                        id="sendBtn"
                        class="bg-slate-900 hover:bg-slate-800 active:bg-amber-500 text-amber-400 active:text-slate-950 p-2 sm:px-3 rounded-xl text-xs font-bold transition flex items-center justify-center flex-shrink-0"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </form>
            </div>

        </div>

    </main>

                appendAssistantTextMessage("抱歉，剛才連線稍有延遲！簡單來說，科學上任何補充劑或運動法都講求個體差異與劑量，建議評估自身體況，必要時諮詢醫師或教練最保險喔！你平時有遇過類似狀況嗎？");
            } finally {
                showTyping(false);
            }
        }

                </div>
                <div class="flex-1 bg-white border border-slate-200 rounded-2xl rounded-tl-none p-4 shadow-sm text-xs sm:text-sm text-slate-800 space-y-3 leading-relaxed">

        // 新增一般對話回覆
        function appendAssistantTextMessage(text) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex items-start space-x-2.5 max-w-full";
            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-amber-400 flex items-center justify-center text-slate-950 font-black text-xs flex-shrink-0 shadow-sm border border-amber-300 mt-1">
                    77

            `;
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        // 格式化志祺七七腳本為易讀的排版
        function formatShichiMarkdown(text) {
            let s = escapeHtml(text);

            // 針對 5 個主要模組標題做高亮卡片設計
            s = s.replace(/(💡【.*?】)/g, '<div class="font-black text-sm text-amber-900 bg-amber-100/70 p-2 rounded-xl mt-3 mb-1 border-l-4 border-amber-500">$1</div>');
            s = s.replace(/(📜【.*?】)/g, '<div class="font-black text-sm text-sky-900 bg-sky-100/70 p-2 rounded-xl mt-3 mb-1 border-l-4 border-sky-500">$1</div>');
            s = s.replace(/(⚔️【.*?】)/g, '<div class="font-black text-sm text-rose-900 bg-rose-100/70 p-2 rounded-xl mt-3 mb-1 border-l-4 border-rose-500">$1</div>');
            s = s.replace(/(⚖️【.*?】)/g, '<div class="font-black text-sm text-emerald-900 bg-emerald-100/70 p-2 rounded-xl mt-3 mb-1 border-l-4 border-emerald-500">$1</div>');
            s = s.replace(/(🤔【.*?】)/g, '<div class="font-black text-sm text-violet-900 bg-violet-100/70 p-2 rounded-xl mt-3 mb-1 border-l-4 border-violet-500">$1</div>');

            // 粗體處理
            s = s.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 font-bold">$1</strong>');
            
            // 條列點處理
            s = s.replace(/^[•\-\*]\s+(.*)$/gm, '<div class="flex items-start space-x-1.5 ml-1 my-1"><span class="text-amber-500 font-bold">•</span><span class="flex-1">$1</span></div>');

            // 換行處理
            s = s.replace(/\n\n+/g, '<div class="my-2"></div>');
            s = s.replace(/\n/g, '<br>');

            return s;
        }

        // HTML 轉義工具
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // 語音朗讀功能 (Web Speech API)
        function toggleSpeechReadout(elementId) {
            if (!speechSynth) {
                showToast("⚠️ 您的瀏覽器不支援語音合成功能");
                return;
            }

            const btn = document.getElementById('ttsBtn_' + elementId);
            const label = btn ? btn.querySelector('.tts-label') : null;

            if (isSpeaking) {
                speechSynth.cancel();
                isSpeaking = false;
                if (label) label.innerText = "聽語音";
                showToast("⏹️ 已停止朗讀");
                return;
            }

            const textElem = document.getElementById(elementId);
            if (!textElem) return;

            const textToSpeak = textElem.innerText;
            const utterThis = new SpeechSynthesisUtterance(textToSpeak);
            utterThis.lang = 'zh-TW';
            utterThis.rate = 1.05; // 稍快，符合志祺的俐落口條
            utterThis.pitch = 1.0;

            utterThis.onstart = () => {
                isSpeaking = true;
                if (label) label.innerText = "停止";
                showToast("🔊 志祺七七語音導讀開始...");
            };

            utterThis.onend = () => {
                isSpeaking = false;
                if (label) label.innerText = "聽語音";
            };

            utterThis.onerror = () => {
                isSpeaking = false;
                if (label) label.innerText = "聽語音";
            };

            speechSynth.speak(utterThis);
        }

        // 複製全文到剪貼簿 (遵循指令使用 document.execCommand('copy') 避免 iframe 限制)
        function copyArticleText(elementId) {
            const elem = document.getElementById(elementId);
            if (!elem) return;

            const text = elem.innerText;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast("📋 全文已成功複製到剪貼簿！");
                } else {
                    showToast("⚠️ 複製失敗，請手動選取");
                }
            } catch (err) {
                showToast("⚠️ 複製失敗，請手動選取");
            }
            document.body.removeChild(textArea);
        }

        // 滾動到底部
        function scrollToBottom() {
            setTimeout(() => {
                const chatContainer = document.getElementById('chatMessages');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }

        // 顯示載入中提示
        function showTyping(show, text = "") {
            isGenerating = show;
            const indicator = document.getElementById('typingIndicator');
            const typingText = document.getElementById('typingText');
            if (show) {
                typingText.innerText = text;
                indicator.classList.remove('hidden');
                scrollToBottom();
            } else {
                indicator.classList.add('hidden');
            }
        }

        // 替代 alert 的精緻 Toast 提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2600);
        }

        // 離線備援腳本生成器（確保斷網時依然具備高品質志祺七七體驗）
        function generateOfflineScript(topic) {
            return `💡【生活化破題・反直覺開場】
哈囉大家好，我是志祺！你有沒有聽過身邊的朋友，最近常常在聊「${topic.keyword || '這個話題'}」？
大家常直覺認為只要照著網路說法做，就能輕鬆見效，但你有沒有想過，為什麼學界和醫學界總是有截然不同的聲音？今天就讓我們用 7 分鐘，一起客觀聊聊這件事！

📜【科學背景與運作脈絡】
簡單來說，在人體的生理機制當中，這件事情就像是工廠裡的生產線調配。
當外在刺激或營養成分進入體內時，細胞並不是照單全收，而是需要特定的酵素與受體共同協作。
如果我們忽略了劑量與時間點，再好的東西進入身體也可能只是徒勞無功。

⚔️【核心爭議與常見誤區】
不過在網路社群上，大家最常犯的第一個錯誤，就是「倒果為因」。
許多人常把相關性當作因果性，甚至市售許多產品為了商業行銷，刻意放大了動物實驗的結果，卻忽略了人體臨床實驗在吸收率與代謝上的巨大落差。

⚖️【最新科學研究與實用建議】
那麼，國際頂尖期刊與醫學指南到底怎麼說呢？
根據最新的系統性文獻回顧，對於健康的一般成年人來說，建議掌握以下兩大核心原則：
1. 先建立穩固的生活基石：確保睡眠充足與均衡飲水，這兩者對身體自癒力的效益遠大於任何單一捷徑。
2. 循序漸進且量力而為：任何調整都應該給身體 2 至 4 週的觀察期，並記錄身心反饋。

🤔【七七總結與留言反思】
回到我們一開始的問題，科學研究從來不是非黑即白，而是隨著研究不斷修正的過程。
那今天這支影片聊到這裡，也想問問大家：你平常會嘗試這類新方法嗎？還是你曾經踩過哪些意想不到的雷？
歡迎在底下留言跟我們分享！最後，如果你喜歡這支影片，歡迎按讚訂閱分享出去，那我們就明晚七點再見囉，掰掰！`;
        }

        // 初始化載入
        window.addEventListener('DOMContentLoaded', () => {
            loadCategoryTopics('運動科學');
        });
    </script>
